name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.7
  PROJECT_NAME: Funkin
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache Haxelib
        id: cache-haxelib
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: ${{ runner.os }}-${{ inputs.name }}-haxelib-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.name }}-haxelib-${{ env.HAXE_VERSION }}-

      - name: Cache Gradle
        if: inputs.name == 'Android x64' || inputs.name == 'Android x32'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ inputs.name }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ inputs.name }}-

      - name: Update APT
        if: inputs.name == 'Linux'
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update --fix-missing

      - name: Install libVLC
        if: inputs.name == 'Linux'
        run: sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Install Wayland Scanner
        if: inputs.name == 'Linux'
        run: sudo apt-get install -y libwayland-bin wayland-protocols

      - name: Setup XCode
        if: inputs.name == 'iOS'
        uses: maxim-lobanov/setup-xcode@master
        with:
          xcode-version: '16.4'

      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Build HXCPP tools
        run: |
          cd "$(haxelib libpath hxcpp)tools/hxcpp"
          haxe compile.hxml

      - name: Rebuild Lime CFFI
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        run: haxelib run lime rebuild cpp

      - name: Configure Android x64
        if: inputs.name == 'Android x64'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          haxelib run lime config ANDROID_SETUP true

      - name: Configure Android x32
        if: inputs.name == 'Android x32'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          haxelib run lime config ANDROID_SETUP true

      - name: Rebuild Lime CFFI (Android)
        if: steps.cache-haxelib.outputs.cache-hit != 'true' && (inputs.name == 'Android x64' || inputs.name == 'Android x32')
        run: haxelib run lime rebuild android

      - name: Rebuild Lime CFFI (iOS)
        if: steps.cache-haxelib.outputs.cache-hit != 'true' && inputs.name == 'iOS'
        run: haxelib run lime rebuild ios

      - name: Compile
        run: haxelib run lime build ${{ inputs.buildArgs }}

      - name: List Android build outputs
        if: (inputs.name == 'Android x64' || inputs.name == 'Android x32') && always()
        continue-on-error: true
        run: find export/release/android/bin -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
